<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mood Diary · Admin Login</title><link rel="stylesheet" href="login.css"></head>
<body><main class="login-card"><div class="brand">📔 Mood Diary · Admin</div><h1>Admin login</h1><p class="intro">Sign in with your administrator account.</p>
<form id="loginForm" action="api/login.php" method="post"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" maxlength="120" required placeholder="you@example.com"><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="passwordRequirements"><button id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
<p id="loginError" class="error" role="alert"></p><button class="submit" id="loginButton" type="submit">Log in</button><noscript><p>Please enable JavaScript to log in.</p></noscript></form>
<p class="account-link"><a href="../index.html">Back to Mood Diary</a></p><p class="footer">Your days. Your thoughts. Your diary.</p></main><script src="login.js"></script></body></html>
