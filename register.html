<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Diary · Register</title>
  <link rel="stylesheet" href="css/login.css?v=register-2">
</head>
<body>
  <main class="login-card">
    <div class="brand">Mood Diary</div>
    <h1>Start your diary.</h1>
    <p class="intro">Create an account for your everyday feelings.</p>
    <form id="registerForm" action="api/register.php" method="post">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="50" required placeholder="Your name">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" maxlength="120" required placeholder="you@example.com" aria-describedby="emailStatus">
      <p id="emailStatus" class="email-status" role="status"></p>
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="passwordRequirements passwordMatch">
        <button id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <ul id="passwordRequirements" class="requirements">
        <li id="ruleLength">At least 8 characters</li>
        <li id="ruleSpecial">At least 1 special character (e.g. ! @ # $)</li>
        <li id="ruleUppercase">At least 1 uppercase letter (A–Z)</li>
      </ul>
      <label for="confirmPassword">Confirm password</label>
      <div class="password-field">
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="passwordMatch">
        <button id="toggleConfirmPassword" type="button" aria-label="Show confirm password" aria-pressed="false">Show</button>
      </div>
      <p id="passwordMatch" class="email-status" role="status"></p>
      <p id="registerSuccess" class="success" role="status"></p>
      <p id="registerError" class="error" role="alert"></p>
      <button class="submit" id="registerButton" type="submit">Create account</button>
      <noscript><p>Please enable JavaScript to create an account.</p></noscript>
    </form>
    <p class="account-link">Already have an account? <a href="login.html">Log in</a></p>
    <p class="footer">Your days. Your thoughts. Your diary.</p>
  </main>
  <script src="js/register.js?v=3"></script>
</body>
</html>
