<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="referrer" content="no-referrer"><title>Mood Diary · Forgot password?</title><link rel="stylesheet" href="css/login.css?v=reset-1"></head>
<body><main class="login-card"><div class="brand">Mood Diary</div><h1>Forgot password?</h1><p class="intro">Enter your account email to request a verification code.</p>
