<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="referrer" content="no-referrer"><title>Mood Diary · Choose a password.</title><link rel="stylesheet" href="css/login.css?v=reset-1"></head>
<body><main class="login-card"><div class="brand">Mood Diary</div><h1>Choose a password.</h1><p class="intro">Use a new password for your Mood Diary account.</p>
<form id="resetForm">
<label for="email">Registered email</label><input id="email" type="email" autocomplete="email" maxlength="120" required placeholder="you@example.com">
<label for="code">Verification code</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required aria-describedby="codeHelp"><p id="codeHelp" class="email-status">Enter the 6-digit code from your email. It expires after 30 minutes.</p>
<label for="password">New password</label><div class="password-field"><input id="password" type="password" autocomplete="new-password" required aria-describedby="requirements"><button type="button" data-toggle="password" aria-label="Show new password" aria-pressed="false">Show</button></div>
<ul id="requirements" class="requirements"><li id="length">At least 8 characters</li><li id="special">At least 1 special character</li><li id="upper">At least 1 uppercase letter (A–Z)</li></ul>
<label for="confirmPassword">Confirm password</label><div class="password-field"><input id="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="match"><button type="button" data-toggle="confirmPassword" aria-label="Show confirm password" aria-pressed="false">Show</button></div>
<p id="match" class="error" role="status"></p><button class="submit" type="submit">Reset password</button></form>
<p class="account-link"><a href="forgot_password.html">Request a new code</a></p>
<p id="feedback" role="status"></p><p class="account-link"><a href="login.html">Back to login</a></p>
</main><script src="js/password_reset.js?v=2"></script></body></html>
